# Basic Configuration Example
# This is the minimal configuration needed to get started.
#
# Before installing, create the required secret:
#
#   kubectl create secret generic opencode-k8s-agent-secret \
#     --from-literal=OPENCODE_API_KEY="your-model-endpoint-api-key" \
#     --from-literal=APPRISE_URLS="discord://webhook-id/webhook-token"
#
# Note: OPENCODE_API_KEY is the model-endpoint bearer (Authorization: Bearer).
# Provide it in the secret, or inject it at runtime (e.g. a projected SA token).

opencode-k8s-agent:
  controllers:
    main:
      cronjob:
        # Run every 12 hours
        schedule: "0 */12 * * *"

      containers:
        main:
          env:
            # Use OpenAI GPT-4
            OPENCODE_MODEL: "gpt-4"
            OPENCODE_BASE_URL: "https://api.openai.com/v1"

            # Apprise API running in same namespace
            APPRISE_API_URL: "http://apprise-api:8000"

            # Keycloak OIDC settings
            KEYCLOAK_URL: "https://auth.example.com"
            KEYCLOAK_REALM: "your-realm"
            KEYCLOAK_CLIENT_ID: "opencode-k8s"

# Use default RBAC (read-only access)
rbac:
  create: true

# Use default prompts and documentation
# (no configMaps override needed)
