# Example ArgoCD Application with values override
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencode-k8s-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/your-repo
    targetRevision: main
    path: helm/opencode-k8s-agent
    helm:
      values: |
        # Override ConfigMap contents
        configMaps:
          runtime:
            opencode.json: |
              {
                "logLevel": "INFO",
                "provider": {
                  "lightbridge": {
                    "npm": "@ai-sdk/openai-compatible",
                    "options": {
                      "baseURL": "${OPENCODE_BASE_URL}",
                      "apiKey": "${OPENCODE_API_KEY}"
                    },
                    "models": {
                      "${OPENCODE_MODEL}": {
                        "id": "${OPENCODE_MODEL}",
                        "tool_call": true
                      }
                    }
                  }
                },
                "agent": {
                  "coder": {
                    "model": "lightbridge:${OPENCODE_MODEL}"
                  }
                },
                "mcp": {
                  "kubernetes": {
                    "type": "local",
                    "command": ["/usr/local/bin/kubernetes-mcp-server"],
                    "enabled": true
                  }
                }
              }
            prompt.md: |
              # Custom Prompt for Production
              Your custom prompt content here...
            run.sh: |
              #!/bin/bash
              set -euo pipefail
              echo "Custom production script"
              # Your custom script here...
          docs:
            custom-resources.md: |
              # Custom Resources Guide
              Your custom documentation...
            runbook.md: |
              # Production Runbook
              Your custom runbook...
        
        # You can also override other values
        opencode-k8s-agent:
          controllers:
            main:
              cronjob:
                schedule: "0 */6 * * *"  # Run every 6 hours instead of 12
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
