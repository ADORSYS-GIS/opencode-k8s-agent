opencode-k8s-agent:
  global:
    nameOverride: opencode-k8s-agent
    fullnameOverride: opencode-k8s-agent

  controllers:
    main:
      enabled: true
      type: cronjob
      cronjob:
        schedule: "0 */12 * * *"
        concurrencyPolicy: Forbid
        successfulJobsHistory: 1
        failedJobsHistory: 1
        backoffLimit: 1
        activeDeadlineSeconds: 3600
      pod:
        restartPolicy: Never
      containers:
        main:
          image:
            repository: ghcr.io/adorsys-gis/opencode-k8s-agent
            tag: newwest
            pullPolicy: IfNotPresent
          command: ["/bin/bash", "/config/run.sh"]
          env:
            OPENCODE_MODEL: "minimax-m2p7"
            OPENCODE_BASE_URL: "https://api.ai.camer.digital/v1"
            APPRISE_API_URL: "http://apprise-api:8000"
            KEYCLOAK_URL: "https://auth.verif.fyi"
            KEYCLOAK_REALM: "camer-digital"
            KEYCLOAK_CLIENT_ID: "opencode-k8s"
          envFrom:
            - secretRef:
                name: opencode-k8s-agent-secret
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi

  serviceAccount:
    main:
      enabled: true
      forceRename: main

  persistence:
    runtime:
      enabled: true
      type: configMap
      name: opencode-k8s-agent-config
      globalMounts:
        - path: /config
          readOnly: true
    docs:
      enabled: true
      type: configMap
      name: opencode-k8s-agent-docs
      globalMounts:
        - path: /docs
          readOnly: true

  # secrets block intentionally omitted — the secret must be
  # created externally (e.g. via ESO) with the name opencode-k8s-agent-secret
  # containing: OPENCODE_API_KEY, APPRISE_URLS, KEYCLOAK_CLIENT_SECRET

# RBAC Configuration (custom - not part of app-template v4)
rbac:
  create: true
  clusterRole:
    name: opencode-k8s-agent-readonly
    rules:
      - apiGroups: [""]
        resources: [nodes, pods, pods/log, events, services, endpoints, configmaps, persistentvolumeclaims]
        verbs: [get, list, watch]
      - apiGroups: ["apps"]
        resources: [deployments, statefulsets, daemonsets]
        verbs: [get, list, watch]
      - apiGroups: ["batch"]
        resources: [jobs, cronjobs]
        verbs: [get, list, watch]
      - apiGroups: ["networking.k8s.io"]
        resources: [ingresses]
        verbs: [get, list, watch]
      - apiGroups: ["autoscaling"]
        resources: [horizontalpodautoscalers]
        verbs: [get, list, watch]
      - apiGroups: ["apiextensions.k8s.io"]
        resources: [customresourcedefinitions]
        verbs: [get, list, watch]
      - apiGroups: ["postgresql.cnpg.io"]
        resources: [clusters]
        verbs: [get, list, watch]
      - apiGroups: ["external-secrets.io"]
        resources: [externalsecrets, secretstores, clustersecretstores]
        verbs: [get, list, watch]
      - apiGroups: ["cert-manager.io"]
        resources: [certificates, certificaterequests, issuers, clusterissuers]
        verbs: [get, list, watch]
      - apiGroups: ["authorino.kuadrant.io"]
        resources: [authconfigs]
        verbs: [get, list, watch]
  clusterRoleBinding:
    create: true
    name: opencode-k8s-agent-readonly-binding

# Notification settings
notifications:
  discord:
    enabled: true
    webhookUrl: ""
  slack:
    enabled: false
    webhookUrl: ""
  email:
    enabled: false
    smtpHost: ""
    smtpPort: 587
    fromAddr: ""
    toAddrs: []

# OpenCode settings
opencode:
  model: minimax-m2p7
  baseUrl: https://api.ai.camer.digital/v1
  thinking: true

# Keycloak OIDC settings
keycloak:
  enabled: true
  url: https://auth.verif.fyi
  realm: camer-digital
  clientId: opencode-k8s

# ConfigMap file contents (optional overrides)
# If not specified, files from files/runtime/ and files/docs/ will be used
configMaps:
  runtime: {}
    # opencode.json: |
    #   { "logLevel": "INFO" }
    # prompt.md: |
    #   Custom prompt content
    # run.sh: |
    #   #!/bin/bash
    #   echo "Custom script"
  docs: {}
    # custom-resources.md: |
    #   Custom docs
    # runbook.md: |
    #   Custom runbook

