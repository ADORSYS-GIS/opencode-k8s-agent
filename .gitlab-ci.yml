stages:
  - review

.opencode-base:
  image: node:22-slim
  interruptible: true
  before_script:
    - apt-get update && apt-get install -y git curl jq
    - npm install -g opencode-ai
    - git config --global user.name "OpenCode Bot"
    - git config --global user.email "opencode-bot@users.noreply.gitlab.com"

opencode-auto-review:
  extends: .opencode-base
  stage: review
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - echo "Running Auto Review..."
    - opencode run "Review the changes in this Merge Request for quality, security, and potential bugs." --agent auto-review --model "lightbridge/gemini-3.1-flash-lite" --format json > review_output.jsonl
    - grep -E '"type":[ ]*"text"' review_output.jsonl | tail -1 | jq -r '.part.text' > review_summary.txt
    - cat review_summary.txt
  artifacts:
    when: always
    paths:
      - review_output.jsonl
      - review_summary.txt
  after_script:
    - |
      echo "Debug: MR_IID='$CI_MERGE_REQUEST_IID', PROJECT_ID='$CI_PROJECT_ID', TOKEN_SET='$( [ -n "$GITLAB_TOKEN" ] && echo "yes" || echo "no" )'"
      if [ -n "$CI_MERGE_REQUEST_IID" ] && [ -n "$GITLAB_TOKEN" ]; then
        if [ "$CI_JOB_STATUS" == "success" ] && [ -f review_summary.txt ]; then
          MESSAGE=$(cat review_summary.txt)
          echo "Posting review results to Merge Request #$CI_MERGE_REQUEST_IID..."
          curl --fail --show-error --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "body=$MESSAGE" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
        elif [ "$CI_JOB_STATUS" == "failed" ]; then
          echo "Reporting job failure to Merge Request..."
          curl --fail --show-error --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "body=🤖 Review job failed. [View logs]($CI_JOB_URL)" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
        fi
      fi

opencode-manual-review:
  extends: .opencode-base
  stage: review
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  script:
    - echo "Running Manual Review..."
    - opencode run "Review the changes in this Merge Request and provide detailed feedback." --agent manual-review --model "lightbridge/glm-5" --format json > review_output.jsonl
    - grep -E '"type":[ ]*"text"' review_output.jsonl | tail -1 | jq -r '.part.text' > review_summary.txt
    - cat review_summary.txt
  artifacts:
    when: always
    paths:
      - review_output.jsonl
      - review_summary.txt
  after_script:
    - |
      echo "Debug: MR_IID='$CI_MERGE_REQUEST_IID', PROJECT_ID='$CI_PROJECT_ID', TOKEN_SET='$( [ -n "$GITLAB_TOKEN" ] && echo "yes" || echo "no" )'"
      if [ -n "$CI_MERGE_REQUEST_IID" ] && [ -n "$GITLAB_TOKEN" ]; then
        if [ "$CI_JOB_STATUS" == "success" ] && [ -f review_summary.txt ]; then
          MESSAGE=$(cat review_summary.txt)
          echo "Posting review results to Merge Request #$CI_MERGE_REQUEST_IID..."
          curl --fail --show-error --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "body=$MESSAGE" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
        elif [ "$CI_JOB_STATUS" == "failed" ]; then
          echo "Reporting job failure to Merge Request..."
          curl --fail --show-error --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "body=🤖 Manual review job failed. [View logs]($CI_JOB_URL)" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
        fi
      fi
